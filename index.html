const ALL_CONTINENTS = ["Africa", "Antarctica", "Asia", "Australia & Oceania", "Europe", "North America", "South America"];
const ALL_DISCIPLINES = Object.keys(DISCIPLINE_COLORS).sort();

let selectedContinents = new Set();
let selectedCountries = new Set();
let selectedDisciplines = new Set();

const searchInput = document.getElementById('searchInput');
const colorModeSelect = document.getElementById('colorModeSelect');
const modeBirth = document.getElementById('modeBirth');
const modeWork = document.getElementById('modeWork');
const geoTreeContainer = document.getElementById('geoTreeContainer');
const disciplineContainer = document.getElementById('disciplineContainer');
const legendBar = document.getElementById('legendBar');
const statsBar = document.getElementById('statsBar');
const grid = document.getElementById('cardGrid');

function getContinentCountryMap() {
  const useBirth = modeBirth.checked;
  const useWork = modeWork.checked;
  const map = {};
  ALL_CONTINENTS.forEach(c => map[c] = {});

  SCIENTISTS.forEach(s => {
    const pairs = new Set();
    if (useBirth) {
      pairs.add(`${s.continent_of_birth}|||${s.country_of_birth}`);
    }
    if (useWork) {
      s.countries_of_work_list.forEach((wc, idx) => {
        const wCont = s.continents_of_work_list[idx] || s.continents_of_work_list[0];
        pairs.add(`${wCont}|||${wc}`);
      });
    }
    pairs.forEach(p => {
      const [cont, country] = p.split('|||');
      if (map[cont]) {
        map[cont][country] = (map[cont][country] || 0) + 1;
      }
    });
  });
  return map;
}

function renderGeoTree() {
  const map = getContinentCountryMap();
  geoTreeContainer.innerHTML = ALL_CONTINENTS.map(cont => {
    const countriesObj = map[cont] || {};
    const countryNames = Object.keys(countriesObj).sort();
    if (countryNames.length === 0) return '';
    const isContChecked = selectedContinents.has(cont);

    const countriesHtml = isContChecked ? `
      <div class="tree-countries">
        ${countryNames.map(c => `
          <label class="country-pill">
            <input type="checkbox" data-country="${c}" ${selectedCountries.has(c) ? 'checked' : ''} onchange="onCountryToggle('${c}', this.checked)">
            ${c} (${countriesObj[c]})
          </label>
        `).join('')}
      </div>
    ` : '';

    return `
      <div class="tree-node">
        <div class="tree-continent-row">
          <label>
            <input type="checkbox" data-continent="${cont}" ${isContChecked ? 'checked' : ''} onchange="onContinentToggle('${cont}', this.checked)">
            <span>${cont}</span>
            <span style="color:#94a3b8; font-weight:400; font-size:0.8rem;">(${countryNames.length} countries)</span>
          </label>
          ${isContChecked ? `
            <div style="display:flex; gap:0.35rem;">
              <button class="btn btn-secondary" onclick="selectContinentCountries('${cont}', true)">All</button>
              <button class="btn btn-secondary" onclick="selectContinentCountries('${cont}', false)">None</button>
            </div>
          ` : ''}
        </div>
        ${countriesHtml}
      </div>
    `;
  }).join('');
}

function onContinentToggle(cont, checked) {
  const map = getContinentCountryMap();
  const cList = Object.keys(map[cont] || {});
  if (checked) {
    selectedContinents.add(cont);
    cList.forEach(c => selectedCountries.add(c));
  } else {
    selectedContinents.delete(cont);
    cList.forEach(c => selectedCountries.delete(c));
  }
  renderGeoTree();
  renderCards();
}

function onCountryToggle(country, checked) {
  if (checked) selectedCountries.add(country);
  else selectedCountries.delete(country);
  renderCards();
}

function selectContinentCountries(cont, selectAll) {
  const map = getContinentCountryMap();
  Object.keys(map[cont] || {}).forEach(c => {
    if (selectAll) selectedCountries.add(c);
    else selectedCountries.delete(c);
  });
  renderGeoTree();
  renderCards();
}

function toggleAllContinents(selectAll) {
  const map = getContinentCountryMap();
  selectedContinents.clear();
  selectedCountries.clear();
  if (selectAll) {
    ALL_CONTINENTS.forEach(cont => {
      const cList = Object.keys(map[cont] || {});
      if (cList.length > 0) {
        selectedContinents.add(cont);
        cList.forEach(c => selectedCountries.add(c));
      }
    });
  }
  renderGeoTree();
  renderCards();
}

function renderDisciplines() {
  const counts = {};
  ALL_DISCIPLINES.forEach(d => counts[d] = 0);
  SCIENTISTS.forEach(s => s.disciplines.forEach(d => counts[d] = (counts[d] || 0) + 1));

  disciplineContainer.innerHTML = ALL_DISCIPLINES.map(d => `
    <label class="disc-pill">
      <input type="checkbox" value="${d}" ${selectedDisciplines.has(d) ? 'checked' : ''} onchange="onDisciplineToggle('${d}', this.checked)">
      <span>${d} (${counts[d]})</span>
    </label>
  `).join('');
}

function onDisciplineToggle(disc, checked) {
  if (checked) selectedDisciplines.add(disc);
  else selectedDisciplines.delete(disc);
  renderCards();
}

function toggleAllDisciplines(selectAll) {
  selectedDisciplines.clear();
  if (selectAll) ALL_DISCIPLINES.forEach(d => selectedDisciplines.add(d));
  renderDisciplines();
  renderCards();
}

function renderLegend() {
  const mode = colorModeSelect.value;
  if (mode === 'uniform') {
    legendBar.innerHTML = `<strong>Color Legend:</strong> <span class="legend-item"><span class="legend-swatch" style="background:#38bdf8"></span> Uniform Slate-Blue Theme</span>`;
    return;
  }
  const palette = (mode === 'discipline') ? DISCIPLINE_COLORS : CONTINENT_COLORS;
  const label = (mode === 'work_continent') ? 'Continent of Work' : (mode === 'birth_continent' ? 'Continent of Birth' : 'Primary Discipline');
  legendBar.innerHTML = `<strong>Color Legend (${label}):</strong> ` +
    Object.entries(palette).map(([k, col]) => `
      <span class="legend-item"><span class="legend-swatch" style="background:${col}"></span>${k}</span>
    `).join('');
}

function getCardAccentColor(s) {
  const mode = colorModeSelect.value;
  if (mode === 'uniform') return '#38bdf8';
  if (mode === 'birth_continent') return CONTINENT_COLORS[s.continent_of_birth] || '#38bdf8';
  if (mode === 'discipline') return DISCIPLINE_COLORS[s.primary_discipline] || '#38bdf8';
  const primaryWorkCont = s.continents_of_work_list[0] || 'North America';
  return CONTINENT_COLORS[primaryWorkCont] || '#38bdf8';
}

function renderCards() {
  renderLegend();
  const q = searchInput.value.toLowerCase().trim();
  const useBirth = modeBirth.checked;
  const useWork = modeWork.checked;

  const filtered = SCIENTISTS.filter(s => {
    let matchGeo = true;
    if (selectedContinents.size > 0 || selectedCountries.size > 0) {
      let bMatch = false;
      let wMatch = false;
      if (useBirth) {
        const contOk = selectedContinents.has(s.continent_of_birth);
        const countryOk = selectedCountries.has(s.country_of_birth);
        bMatch = contOk && countryOk;
      }
      if (useWork) {
        wMatch = s.countries_of_work_list.some((wc, idx) => {
          const wCont = s.continents_of_work_list[idx] || s.continents_of_work_list[0];
          return selectedContinents.has(wCont) && selectedCountries.has(wc);
        });
      }
      matchGeo = bMatch || wMatch;
    }

    let matchDisc = true;
    if (selectedDisciplines.size > 0) {
      matchDisc = s.disciplines.some(d => selectedDisciplines.has(d));
    }

    const hay = `${s.name} ${s.primary_field} ${s.disciplines.join(' ')} ${s.key_discovery} ${s.birthplace} ${s.country_of_birth} ${s.continent_of_birth} ${s.country_of_work} ${s.continent_of_work}`.toLowerCase();
    const matchQ = !q || hay.includes(q);

    return matchGeo && matchDisc && matchQ;
  });

  statsBar.textContent = `Showing ${filtered.length} of ${SCIENTISTS.length} scientists`;

  grid.innerHTML = filtered.map(s => {
    const accent = getCardAccentColor(s);
    return `
      <article class="poster-card" style="--card-accent: ${accent}">
        <div class="card-top">
          <div class="card-header">
            <h2 class="card-name">${s.name}</h2>
            <span class="card-num">#${String(s.id).padStart(3, '0')}</span>
          </div>
          <div class="card-field">${s.primary_field}</div>
          <p class="card-discovery">${s.key_discovery}</p>
        </div>
        <div>
          <div class="card-meta">
            <div><strong>Birthplace:</strong> ${s.birthplace} (${s.country_of_birth} &bull; ${s.continent_of_birth})</div>
            <div><strong>Country of Work:</strong> ${s.country_of_work} (${s.continent_of_work})</div>
          </div>
          <div class="card-footer">
            <span class="badge">${s.disciplines.join(' &bull; ')}</span>
            <a class="source-link" href="${s.source}" target="_blank" rel="noopener">Biography &rarr;</a>
          </div>
        </div>
      </article>
    `;
  }).join('');
}

function resetAllFilters() {
  searchInput.value = '';
  selectedContinents.clear();
  selectedCountries.clear();
  selectedDisciplines.clear();
  modeBirth.checked = true;
  modeWork.checked = true;
  renderGeoTree();
  renderDisciplines();
  renderCards();
}

modeBirth.addEventListener('change', () => { renderGeoTree(); renderCards(); });
modeWork.addEventListener('change', () => { renderGeoTree(); renderCards(); });
colorModeSelect.addEventListener('change', renderCards);
searchInput.addEventListener('input', renderCards);

renderGeoTree();
renderDisciplines();
renderCards();
</script>
</body>
</html>
